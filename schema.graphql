# ============================================================================
# schema.graphql -- SOURCE OF TRUTH for the graph.
#
# This SDL is written first; the TypeScript resolver types in
# src/generated/graphql.ts are generated FROM this file (see codegen.ts).
# The gateway fronts a REST backend exposing authors -> books -> reviews.
# ============================================================================

type Query {
  """
  Relay-style cursor-paginated list of authors.
  Forward: `first` (default 10 when neither `first` nor `last` is given) items
  after the opaque `after` cursor. Backward: the `last` items before the opaque
  `before` cursor (or before the end of the list). `first` and `last` together
  is a BAD_PAGINATION_ARGS error. Page sizes clamp to 0..100.
  """
  authors(first: Int, after: String, last: Int, before: String): AuthorConnection!

  "Fetch a single author by id (batched via DataLoader under the hood)."
  author(id: ID!): Author

  "Fetch a single book by id (batched via DataLoader under the hood)."
  book(id: ID!): Book

  """
  Bulk lookup: the books for `ids`, in the order given (a repeated id repeats
  its book). One batched downstream call for the whole list. An unknown id
  yields `null` at its index plus a NOT_FOUND error for that item. At most 100
  ids per request; more is a BAD_ARGUMENT error before any downstream call.
  """
  books(ids: [ID!]!): [Book]!
}

type Author {
  id: ID!
  name: String!
  bio: String!
  """
  All books by this author. Resolved through a batched DataLoader -> one downstream call for a whole page of authors.
  `first` keeps at most that many books (clamped to 0..100; omitted or null keeps all). The
  slice happens after the one batched fetch, so it never adds a downstream call.
  `orderBy` sorts the fetched books in the gateway BEFORE `first` is applied (omitted or
  null keeps backend order); it is not pushed down, so calls and admission cost are unchanged.
  """
  books(first: Int, orderBy: BookOrder): [Book!]!
}

type Book {
  id: ID!
  title: String!
  year: Int!
  "The author of this book (batched by author id)."
  author: Author!
  """
  All reviews for this book. Batched by book id -> one downstream call for a whole page of books.
  `first` keeps at most that many reviews (same clamp and semantics as `Author.books(first)`).
  `orderBy` sorts the fetched reviews in the gateway BEFORE `first` is applied, with the same
  semantics as `Author.books(orderBy)`: `reviews(first: 1, orderBy: RATING_DESC)` is the top review.
  """
  reviews(first: Int, orderBy: ReviewOrder): [Review!]!
}

type Review {
  id: ID!
  rating: Int!
  body: String!
  """
  Reviewer display name. Demonstrates auth-context threading: redacted to
  "REDACTED" unless the request carries a valid bearer token AND the `pii`
  scope is present.
  """
  reviewer: String!
  "The book this review is for (batched by book id)."
  book: Book!
}

"""
Order for `Author.books(orderBy)`, applied in the gateway to the books the backend
returned. The sort is stable: books with equal years keep backend order.
"""
enum BookOrder {
  "Oldest first (publication year ascending)."
  YEAR_ASC
  "Newest first (publication year descending): `books(first: 1, orderBy: YEAR_DESC)` is the latest book."
  YEAR_DESC
}

"""
Order for `Book.reviews(orderBy)`, applied in the gateway to the reviews the backend
returned. The sort is stable: reviews with equal ratings keep backend order.
"""
enum ReviewOrder {
  "Highest rating first."
  RATING_DESC
  "Lowest rating first."
  RATING_ASC
}

# --- Relay connection types (cursor pagination) ---------------------------

type AuthorConnection {
  edges: [AuthorEdge!]!
  pageInfo: PageInfo!
  "Total number of authors available across all pages."
  totalCount: Int!
}

type AuthorEdge {
  node: Author!
  "Opaque cursor marking this edge's position; pass as `after` to read the items following this node, or as `before` to read the items preceding it."
  cursor: String!
}

type PageInfo {
  "True when more items follow this page; keep paging forward with `after: endCursor`."
  hasNextPage: Boolean!
  "True when more items precede this page; keep paging backward with `before: startCursor`."
  hasPreviousPage: Boolean!
  "Cursor of the first edge on this page; pass as `before` to read the previous page."
  startCursor: String
  "Cursor of the last edge on this page; pass as `after` to read the next page."
  endCursor: String
}
