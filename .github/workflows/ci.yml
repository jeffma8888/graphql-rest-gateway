name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify SDL and generated types are in sync
        run: |
          npm run codegen
          git diff --exit-code src/generated/graphql.ts
      - run: npm run build
      - run: npm test
      - name: Prove the N+1 fix
        run: npm run benchmark
